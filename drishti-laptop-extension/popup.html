<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 320px; margin: 14px; color: #0F1A16; }
  h1 { font-size: 15px; margin: 0 0 4px; color: #0B3D2E; }
  p { color: #5E6B66; margin: 4px 0 10px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #E3EAE6; border-radius: 8px; font: 12px monospace; }
  button { margin-top: 8px; padding: 8px 12px; border: 0; border-radius: 8px; background: #0B3D2E; color: #fff; cursor: pointer; }
  button.alt { background: #DDF6E8; color: #0B3D2E; }
  label { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  #status { margin-top: 10px; padding: 8px; background: #F3F6F4; border-radius: 8px; }
</style></head>
<body>
  <h1>Drishti → Daily Vehicle Report</h1>
  <p>In the app: Today → Drishti card → Open → ⋮ → Link office laptop. Paste the code here.</p>
  <input id="code" placeholder="DVR1-…">
  <button id="save">Save code</button>
  <label><input type="checkbox" id="on" style="width:auto"> Send every 3 minutes</label>
  <button id="now" class="alt">Send now</button>
  <button id="open" class="alt">Open Vehicle Summary</button>
  <div id="status">…</div>
  <script src="popup.js"></script>
</body></html>

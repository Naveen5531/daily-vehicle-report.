# Installs the APK on an Android emulator, opens every tab, and reports any crash.
name: Launch test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launch:
    strategy:
      fail-fast: false
      matrix:
        api: [30]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel
          target: ${{ matrix.api >= 33 && 'google_apis' || 'default' }}
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/launch-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-screens-api${{ matrix.api }}
          path: shots/
          if-no-files-found: ignore

      - name: Keep screenshots (branch "screens")
        if: always()
        shell: bash
        run: |
          [ -d shots ] || exit 0
          rm -rf pub && mkdir pub && cp shots/*.png pub/ && cd pub
          SB=screens
          git init -q -b $SB && git add . && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "screens ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" $SB || true

      - name: Report
        if: always()
        run: |
          if [ -f crash.txt ] && [ -s crash.txt ]; then
            msg=$(head -40 crash.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Crash on Android API ${{ matrix.api }}::$msg"
            exit 1
          else
            echo "::notice::API ${{ matrix.api }}: app opened and all tabs worked without crashing"
          fi
